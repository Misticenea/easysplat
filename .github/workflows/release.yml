name: Release binaries

# Self-contained one-file executables (Python bundled inside) so EasySplat
# runs on machines with no Python at all — including immutable OSes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: easysplat-linux-x86_64
          - os: macos-latest
            artifact: easysplat-darwin-arm64
          - os: macos-15-intel
            artifact: easysplat-darwin-x86_64
          - os: windows-latest
            artifact: easysplat-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install . pyinstaller
      - name: Build binary
        run: pyinstaller easysplat.spec
      - name: Rename artifact
        shell: bash
        run: |
          if [ -f dist/easysplat.exe ]; then
            mv dist/easysplat.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/easysplat "dist/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # on workflow_dispatch there is no tag ref: create/update the tag
          # named in the input, pointed at the dispatched commit
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
